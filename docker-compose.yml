services:
  gateway:
    build:
      context: .
      dockerfile: Dockerfile
      secrets:
        - github_token
    environment:
      WATTETHERIA_GATEWAY_BIND: "${WATTETHERIA_GATEWAY_BIND:?set WATTETHERIA_GATEWAY_BIND}"
      WATTETHERIA_GATEWAY_DATABASE_URL: "${WATTETHERIA_GATEWAY_DATABASE_URL:?set WATTETHERIA_GATEWAY_DATABASE_URL}"
      WATTETHERIA_GATEWAY_NATS_URL: "${WATTETHERIA_GATEWAY_NATS_URL:?set WATTETHERIA_GATEWAY_NATS_URL}"
      WATTETHERIA_GATEWAY_REQUEST_TIMEOUT_SECS: "${WATTETHERIA_GATEWAY_REQUEST_TIMEOUT_SECS:?set WATTETHERIA_GATEWAY_REQUEST_TIMEOUT_SECS}"
      WATTETHERIA_GATEWAY_REGISTRY_ADMIN_TOKEN: "${WATTETHERIA_GATEWAY_REGISTRY_ADMIN_TOKEN:?set WATTETHERIA_GATEWAY_REGISTRY_ADMIN_TOKEN}"
      WATTETHERIA_GATEWAY_BOOTSTRAP_REGISTRY_URLS: "${WATTETHERIA_GATEWAY_BOOTSTRAP_REGISTRY_URLS:-}"
      WATTETHERIA_GATEWAY_IDENTITY_ID: "${WATTETHERIA_GATEWAY_IDENTITY_ID:?set WATTETHERIA_GATEWAY_IDENTITY_ID}"
      WATTETHERIA_GATEWAY_IDENTITY_DISPLAY_NAME: "${WATTETHERIA_GATEWAY_IDENTITY_DISPLAY_NAME:?set WATTETHERIA_GATEWAY_IDENTITY_DISPLAY_NAME}"
      WATTETHERIA_GATEWAY_IDENTITY_BASE_URL: "${WATTETHERIA_GATEWAY_IDENTITY_BASE_URL:?set WATTETHERIA_GATEWAY_IDENTITY_BASE_URL}"
      WATTETHERIA_GATEWAY_IDENTITY_REGION: "${WATTETHERIA_GATEWAY_IDENTITY_REGION:?set WATTETHERIA_GATEWAY_IDENTITY_REGION}"
      WATTETHERIA_GATEWAY_IDENTITY_OPERATOR_ID: "${WATTETHERIA_GATEWAY_IDENTITY_OPERATOR_ID:?set WATTETHERIA_GATEWAY_IDENTITY_OPERATOR_ID}"
      WATTETHERIA_GATEWAY_IDENTITY_ROLES: "${WATTETHERIA_GATEWAY_IDENTITY_ROLES:?set WATTETHERIA_GATEWAY_IDENTITY_ROLES}"
      WATTETHERIA_GATEWAY_IDENTITY_SUPPORTED_ENDPOINTS: "${WATTETHERIA_GATEWAY_IDENTITY_SUPPORTED_ENDPOINTS:?set WATTETHERIA_GATEWAY_IDENTITY_SUPPORTED_ENDPOINTS}"
      WATTETHERIA_GATEWAY_IDENTITY_ALLOWS_PUBLIC_INGEST: "${WATTETHERIA_GATEWAY_IDENTITY_ALLOWS_PUBLIC_INGEST:?set WATTETHERIA_GATEWAY_IDENTITY_ALLOWS_PUBLIC_INGEST}"
      WATTETHERIA_GATEWAY_IDENTITY_SIGNING_KEY: "${WATTETHERIA_GATEWAY_IDENTITY_SIGNING_KEY:?set WATTETHERIA_GATEWAY_IDENTITY_SIGNING_KEY}"
    depends_on:
      - postgres
      - nats
    ports:
      - "${WATTETHERIA_GATEWAY_HTTP_PORT:?set WATTETHERIA_GATEWAY_HTTP_PORT}:8080"

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: "${POSTGRES_DB:?set POSTGRES_DB}"
      POSTGRES_USER: "${POSTGRES_USER:?set POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}"
    ports:
      - "${WATTETHERIA_GATEWAY_POSTGRES_PORT:?set WATTETHERIA_GATEWAY_POSTGRES_PORT}:5432"
    volumes:
      - gateway-postgres-data:/var/lib/postgresql/data

  nats:
    image: nats:2.11-alpine
    command: ["-js"]
    ports:
      - "${WATTETHERIA_GATEWAY_NATS_CLIENT_PORT:?set WATTETHERIA_GATEWAY_NATS_CLIENT_PORT}:4222"
      - "${WATTETHERIA_GATEWAY_NATS_MONITOR_PORT:?set WATTETHERIA_GATEWAY_NATS_MONITOR_PORT}:8222"

volumes:
  gateway-postgres-data:

secrets:
  github_token:
    environment: GITHUB_TOKEN
