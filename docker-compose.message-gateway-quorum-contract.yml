services:
  rabbit1:
    image: rabbitmq:4.1-management
    hostname: rabbit1
    environment: &rabbit-environment
      RABBITMQ_DEFAULT_USER: wattswarm
      RABBITMQ_DEFAULT_PASS: contract-password
      RABBITMQ_DEFAULT_VHOST: /wattswarm
      RABBITMQ_ERLANG_COOKIE: wattswarm-quorum-contract-cookie
    healthcheck: &rabbit-healthcheck
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 2s
      timeout: 5s
      retries: 30

  rabbit2:
    image: rabbitmq:4.1-management
    hostname: rabbit2
    environment: *rabbit-environment
    healthcheck: *rabbit-healthcheck

  rabbit3:
    image: rabbitmq:4.1-management
    hostname: rabbit3
    environment: *rabbit-environment
    healthcheck: *rabbit-healthcheck
